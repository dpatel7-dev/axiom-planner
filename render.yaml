services:
  - type: web
    name: axiom-planner
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: axiom-db
          property: connectionString

databases:
  - name: axiom-db
    plan: free
    databaseName: axiom
    user: axiom
